<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visibility</title>
    <style>
        #first{
            height: 50px;
            width: 50px;
            color: brown;
            background-color: aqua; 
            visibility:hidden;
        }
        #second{
            height: 50px;
            width: 50px;
            color: rgb(60, 111, 9);
            background-color: aqua; visibility: visible;
        }
    </style>
</head>
<body>
    <div id="first">Box 1</div>
    <br>
    <div id="second">Box 2</div>
</body>
</html>
