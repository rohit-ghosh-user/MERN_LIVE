<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative unit:Percentage</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-size: 50px;
        }
        #first{
            height: 100px;
            width: 250px;
            font-size: 25px;
            background-color: crimson;
        }
        #second{
            height: 50%;
            width: 80%;
            font-size: 0.5rem;
            /* font-size: 0.5em (for parent element) */
            background-color: cornflowerblue;
        }
    </style>
</head>
<body>
    Body text
    <div id="first">first
        <div id="second">second</div>
    </div>
</body>
</html>
