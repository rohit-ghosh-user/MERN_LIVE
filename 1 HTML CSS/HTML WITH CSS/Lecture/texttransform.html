<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Transform</title>
    <style>
        #heading1{
            text-transform: uppercase;
            color: brown;
        }
        #heading2{
            text-transform:capitalize;
            color: aqua;
        }
        #heading3{
            text-transform:lowercase;
            color: chartreuse;
        }
    </style>
</head>
<body>
   <h1 id="heading1">first heading</h1>
   <h1 id="heading2">second heading</h1>
   <h1 id="heading3">THIRD HEADING</h1>

</body>
</html>
