<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding</title>
    <style>
        *{
            margin: 0px;
            padding:0px;
        }
        .pad{
            padding:2px;
            height: 50px;
            width: 50px; 
            border: 5px solid;
        }
        #first{ 
            margin:5px 10px 25px 10px;
            background-color: lightsalmon; 
            text-align: center;
            border-radius: 10px;
            box-sizing: border-box;
        }
        #second{
            margin:50px 5px 20px 10px;
            background-color: rgb(43, 214, 226);
            border:dotted rgb(78, 153, 51);
            border-radius: 10px 10px 10px 10px;
            box-sizing: content-box;
        }
    </style>
</head>
<body>
    <div id="first" class="pad">First</div> 
    <div id="second" class="pad">Second</div>
</body>
</html>
