<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Grow</title>
    <style>
        *{
            margin:0;
            padding:0;
        }
        #container{
            height: 60vh;
            width: 60vw;
            border: solid cyan;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
             
        }
        .box{
            height: 20%;
            width: 10%;
            background-color: aquamarine;
            margin: 5px;
            border: solid;
            flex-grow: 1;
            
        }
        #box2{
            flex-grow: 2;
            min-width: 150px;
            /* check flex-basis in inspect */
        }


    </style>
</head>
<body>
    <div id="container">
        <div id="box1" class="box">Box 1</div>
        <div id="box2" class="box">Box 2</div>
        <div id="box3" class="box">Box 3</div>
        <div id="box3" class="box">Box 4</div>
    </div>
</body>
</html>
