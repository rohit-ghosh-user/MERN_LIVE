<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Quaries</title>
    <style>
        .box{
            padding: 5px;
            height: 100px;
            width: 100px;
            background-color: darkkhaki;
            
        }
        @media screen and (min-width:250px) and (max-width:300px) {
          .box{
            background-color: blue;
            border-radius: 50%;
          }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
