<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Container</title>
    <style>
        *{
            margin:0;
            padding:0;
        }
        #container{
            height: 600px;
            width: 600px;
            border: solid cyan;
            display:grid;
            /* grid-template-rows: 50px 80px;
            grid-template-columns: 80px 50px; */
            grid-template-rows: repeat(5,1fr);
            grid-template-columns: repeat(3,1fr);
            row-gap: 10px;
            column-gap: 20px;
            /* we can ue grid-gap:10px 20px; it's same as row-gap and column-gap.
                and grid-gap:10px; mean row and column gap is equaly 10p.
             */
            
        }
        .box{
            /* height: 40px;
            width: 50px; */
            background-color: aquamarine;
            /* margin: 5px; */
            /* border: solid; */
        }
        #box1{
            /* grid-column-start: 1;
            grid-column-end: 3;*/

             /* grid-column: 1/3; */

             grid-column: 1/span 2;

             /* all here is same you can check */

             grid-row-start: 1;
             grid-row-end:3 ;

             /* rest is like grid-column */

        }
        #box1{
            
            /* grid-row: 1/2;
            grid-column: 1/2; */
            background-color: brown;
           
        }
        #box2{
            /* grid-row: 1/2;
            grid-column: 2/2; */
            background-color: rgb(248, 239, 3);
           
        }
        #box3{
            /* grid-row: 2/2;
            grid-column: 1/2; */
            background-color: blue;
            
        }
        #box4{
            /* grid-row: 2/2;
            grid-column: 2/2; */
            background-color: chartreuse;
            
        }
        #box5{
            background-color: orangered;
        }

    </style>
</head>
<body>
    <div id="container">
        <div id="box1" class="box">Box 1</div>
        <div id="box2" class="box">Box 2</div>
        <div id="box3" class="box">Box 3</div>
        <div id="box4" class="box">Box 4</div>
        <div id="box5" class="box">Box 5</div>
    </div>
    
    
        <img  src="Grid.jpg">

</body>
</html>
