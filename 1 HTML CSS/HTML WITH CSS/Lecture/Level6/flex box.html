<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
    <style>
        *{
            margin:0;
            padding: 0;
        }
        #heading{
            text-align: center;
        }
        #container{
            height: 400px;
            width: 1000px;
            border: solid 3px;
            display: flex;
            flex-direction: row-reverse;
            justify-content: space-between; /*in this case box position is not change */
            flex-wrap: wrap-reverse;
            background-color: azure;
        }
        .box{
            height: 100px;
            width: 100px;
            margin: 5px;
            border: solid;
            
        }
        #box1{
            background-color: brown;
        }
        #box2{
            background-color: blue;
        }
        #box3{
            background-color: darkorange;
        }
    </style>
</head>
<body>
    <div id="heading">Flex box container</div>
    <div id="container">
        <div id="box1" class="box">Box 1</div>
        <div id="box2" class="box">Box 2</div>
        <div id="box3" class="box">Box 4</div>
        <div id="box3" class="box">Box 5</div>
        <div id="box3" class="box">Box 6</div>
        <div id="box3" class="box">Box 7</div>
        <div id="box3" class="box">Box 8</div>
        <div id="box3" class="box">Box 9</div>
        <div id="box3" class="box">Box 10</div>
        <div id="box3" class="box">Box 11</div>
        <div id="box3" class="box">Box 12</div>
    </div>
</body>
</html>
