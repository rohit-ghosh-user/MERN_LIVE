<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        div{
            height: 200px;
            width: 200px;
            background-color: cyan;
            transition-duration: 1s;
            transition-delay: 1s;
           

        }
        div:hover{
            background-color: darkcyan;
            border-radius: 50%;

        }
    
    </style>
</head>
<body>
    <div></div>
    
</body>
</html>
