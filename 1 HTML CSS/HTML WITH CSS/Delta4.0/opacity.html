<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opacity</title>
    <style>
        div{
            height: 100px;
            width: 100px;
            background-color: blanchedalmond;
            margin: 5px;
        }
        #rgb{
            background-color: rgba(199, 11, 74,0.9);
        }
        #hex{
            background-color: #5f9ea0aa;
        }
        #opacity{
            background-color: darkgoldenrod;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div id="rgb"></div>
    <div id="hex"></div>
    <div id="opacity"></div>
</body>
</html>
