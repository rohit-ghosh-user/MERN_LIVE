<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition2</title>
    <style>
        div{
            height: 200px;
            width: 200px;
            background-color: cyan;
            transition: margin-top 1s ease-in 0.2s;
            margin: 0 auto;
            margin-top: 10px;

        }
        div:hover{
            background-color: darkcyan;
            margin-top: 350px;
            
        }
    
    </style>
</head>
<body>
    <div></div>
    
</body>
</html>
