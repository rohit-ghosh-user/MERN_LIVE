<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>
    <style>
        section{
            margin-top: 100px;
        }
        div{
            height: 50px;
            width: 200px;
            text-align: center;
            background-color: #7aa874;
            border: 2px solid black;
            margin: 10px auto;
        }
        div:nth-of-type(2n){
            background-color: #f7db6a;
        }
        div:nth-of-type(3n){
            background-color: #ebb02d;
        }
        /* Transformation */
        #box1{
            transform: rotate(45deg);
        }
        #box2{
            transform: scale(0.5);
            /* transfom: scaleX(0.5) for x axis 
                do same for y axis
            */
        }
        #box3{
            transform: translate(-100px);
            /* 
             also work with only x axis and y axis
             */
        }
        #box4{
            transform: skew(45deg);
        }
        #box5{
            transform: rotate(45deg) translate(100px) skew(30deg);
        }
    </style>
</head>
<body>
    <section>
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
        <div id="box5">5</div>
    </section>
</body>
</html>
