<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Center align and Capitalized</title>
</head>
<style>
     *{
            margin: 0;
            padding:0;
        }
    #heading{
        color: rgb(234, 156, 55);
        background-color: rgb(195, 193, 193);
        text-align: center;
        text-transform: capitalize;
        font-family: 'Times New Roman', Times, serif;
    }
    #div1{
        font-size: 25px;
    }
    #div2{
        font-size:10px;
    }
</style>
<body>
    <h1 id="heading">This is my first heading</h1>
    <hr>
    <br>
    <div id="div1">Lorem ipsum dolor sit amet consectetur adipisicing elit. Officia, id!
        <div id="div2">Lorem ipsum dolor sit amet consectetur adipisicing elit. Consequuntur officiis velit esse repudiandae eum quae, voluptatum natus soluta quod.</div>

    </div>
</body>
</html>
