<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Table Code</title>
    </head>
    <body>
        <table border="black">
             <caption><b><i>COLD DRINKS</i></b></caption>
             <!-- thead=table header -->
            <thead> 
                    <tr>
                        <th>Item</th> 
                        <th>Quantity</th><!--th=heading-->
                        <th>Price</th>
                    </tr>
            </thead>
            <!-- tbody=body part of table -->
            <tbody>
                <tr>
                    <td>Frooti</td> <!--td=main part of body-->
                    <td>100</td>
                    <td>10</td>
                </tr>
                <tr>
                    <td>Lassi</td>
                    <td>150</td>
                    <td>10</td>
                </tr>
                <tr>
                    <td>Sprite</td>
                    <td>130</td>
                    <td>13</td>
                </tr>             <!--tr means row-->
            </tbody>
            <!-- here footer is not available -->
             <!-- in some calculation type table footer is available -->
        </table>
        <hr>
        <table border="black">
            <caption>Food Menu</caption>
            <thead>
                <tr>
                    <th rowspan="2">Item</th>
                    <th colspan="2">Price</th>

                </tr>
                <tr>
                    
                    <th colspan="1">IND</th>
                    <th colspan="1">USD</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Frooti</td>
                    <td>10</td>
                    <td>0.14</td>
                </tr>
                <tr>
                    <td>Samosha</td>
                    <td>12</td>
                    <td>0.17</td>
                </tr>
                <tr>
                    <td>Chips</td>
                    <td>20</td>
                    <td>0.18</td>
                </tr>
            </tbody>
        </table>
        <hr>
       <!-- practise question 7 -->
        <table border="black">
            <caption>A test table with mearge cells</caption>
            <thead>
                <tr>
                    <th rowspan="2"> </th> <!--rowspan means no of ocupied rows-->
                    <th colspan="2">Average</th> <!--colspan means no of ocupied columns-->
                    <th rowspan="2">Red eyes</th>
                </tr>
                <tr>
                    <th>Height</th>
                    <th>Weight</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Males</td>
                    <td>1.9</td>
                    <td>0.03</td>
                    <td>40%</td>
                </tr>
                <tr>
                    <td>Females</td>
                    <td>1.7</td>
                    <td>0.02</td>
                    <td>43%</td>
                </tr>
            </tbody>
        </table>
        <hr>
    </body>
</html>
