<!DOCTYPE html>
<html lang="en">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Forms</title>
      </head>
      <body>
         <form action="/action">
              <div>

                <label for="username">Enter your yousername:</label>
                    <input type="text" placeholder="Enter your username" id="username" name="user">
              </div>
              <div>
                <label for="passwoard">Entet your passwoard:</label>
                  <input type="password" placeholder="Enter your passwoard" id="passwoard" name="pass">
              </div>
              <button type="submit">Submit</button>
              <hr>
          </form>
          <!-- A search option that redirects its search request to youtube -->
          <form action="https://www.youtube.com/results?">
            <input type="text" placeholder="search" name="search_query">
            <button tye="submit">submit</button>
          </form>
          <hr>
          <!-- A search option that redirects its search request to google -->
           <form action="https://www.google.com/search?">
              <input type="text" placeholder="query" name="q">
              <button type="submit">Search</button>
           </form>
           <hr>
           <!-- Checked box  -->
            <form>
                <input type="checkbox" name="age" id="age" checked>
                <lable for="age">If you 18+</lable>
            <!-- radio button -->
             <br>
                <div>
                      <input type="radio" name="Frut" id="mango" value="mango">
                      <label for="mango">Mango</label>
                      <input type="radio" name="Frut" id="Jackfruit" value="jackf">
                      <label for="mango">Jackfruit</label>
                      <input type="radio" name="Frut" id="apple" value="app">
                      <label for="apple">apple</label>
                      <input type="radio" name="Frut" id="banana" value="ban">
                      <label for="banana">banana</label>
             </div>
             <br>
             <!-- checkbox gruping -->
             <div>
                <input type="checkbox" name="sub" id="CSE" value="cs">
                <label for="CSE">CSE</label>
                <input type="checkbox" name="sub" id="ECE" value="ec">
                <label for="ECE">ECE</label>
                <input type="checkbox" name="sub" id="IT" value="it">
                <label for="IT">IT</label>
             </div>
             <!-- dropdown -->
             <div>
                Choose your profession
                <select name="profession" id="profession">
                    <option >Select profession</option>
                    <option value="stu" selected>Student</option>
                    <option value="dev">Developer</option>
                </select>
             </div> 
             <!-- range -->
             <div>
                <input type="range" id="vol" name="audio" min="0" max="100" step="5" value="50" >
                <label for="vol">Enter Volum</label>
             </div>
             <!-- Text Area -->
              <div>
                <label for="feedback">Enter Your Feedback</label>
                <textarea id="feedback" name="feedback" placeholder="Write your feedback heare"></textarea>
                
              </div>
             <br>
                <button type="submit">submit</button>
                <button type="reset">reset</button>
              </form>
      </body>
  </html>
