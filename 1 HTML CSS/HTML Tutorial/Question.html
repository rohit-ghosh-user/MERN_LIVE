<!DOCTYPE html>

        <form action="/action">

        <button type="submit">Register</button>

         <!-- combination work of form -->
          <form action="/action">
             <div>
                <label for="name">Name</label>

             </div>
             <div>
                SEX:
                <input type="radio" name="sex" id="male" value="male">

                <label for="Female">Female</label>
             </div>

             </div>

            <hr>
              <!--Feedback form  -->
               <form action="/action">
                  <div>
                     <label for="identity">Name</label>
                     <input type="text" id="identity" name="identity" placeholder="write your name">
                  </div>
                  <div>
